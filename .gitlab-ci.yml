image: "python:3.13"

# Branch flow: feature branches -> preview -> main. Every branch is linted and
# tested; preview also builds the package. Merges to main trigger
# semantic-release, which determines the version from commit messages, tags the
# release, and publishes it to PyPI and GitLab. This project has no release
# candidate stage.

stages:
  - format
  - test
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: "true"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

sast:
  stage: test

secret_detection:
  stage: test

# Apply Ruff's automatic fixes, push them to the branch, and then report any
# remaining lint errors.
#
# [skip ci] prevents the automatic-fix commit from starting another pipeline.
# semantic-release uses the same mechanism for release commits.
lint:
  stage: format
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    # Keep this version aligned with .pre-commit-config.yaml and the `dev`
    # extra in pyproject.toml. Avoid floating versions, which can break CI when
    # Ruff releases an update.
    - uv tool install ruff@0.16.6
    - git config --global user.name "Janitor"
    - git config --global user.email "squad@fz-juelich.de"
    - git remote set-url origin https://squad_janitor:$CI_FORMAT@$CI_SERVER_HOST/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
  script:
    # Never rewrite the default branch (merge-only, protected) or a tag.
    - |
      if [ -n "$CI_COMMIT_BRANCH" ] && [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        # Attach HEAD to the branch so the fix commit is created on that branch.
        git checkout -B "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA"
        # Preserve automatic fixes even when unfixable lint errors remain.
        ruff check --fix . || true
        ruff format .
        if git diff --quiet; then
          echo "Nothing to fix."
        else
          git diff --stat
          # Stage tracked files only; the job may have created cache files.
          git add -u
          git commit -m "style: apply ruff fixes [skip ci]"
          # Do not overwrite concurrent branch updates. A new pipeline will
          # process the updated branch after a rejected push.
          git push origin "HEAD:$CI_COMMIT_BRANCH" ||
            echo "WARNING: fixes could not be pushed. Is $CI_COMMIT_BRANCH protected against squad_janitor?"
        fi
      fi
    # Fail the job if errors remain after the automatic fixes.
    - ruff check .
    - ruff format --check .

citation:
  stage: test
  script:
    - pip install --quiet cffconvert==2.0.0
    - cffconvert --validate

pytest:
  stage: test
  # Python 3.13 is the minimum supported version.
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.13", "3.14"]
  image: "python:${PYTHON_VERSION}"
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
  script:
    # The `examples` extra installs qcodes. Without it, pytest skips the
    # QCoDeSSnapshotProvider tests and the QCoDeS example.
    - uv sync --python "$PYTHON_VERSION" --extra test --extra examples
    - uv run --python "$PYTHON_VERSION" pytest --cov --cov-report=term --cov-report=xml --junitxml=report.xml
  # Extract total coverage from pytest-cov's terminal summary.
  coverage: '/^TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  cache:
    key: uv-$CI_JOB_NAME-$PYTHON_VERSION
    paths:
      - .uv-cache

# Report coverage only from Linux to avoid duplicate reports.
pytest-windows:
  stage: test
  tags:
    - windows
  # The Windows Server 2025 runner requires an ltsc2025 image; the generic
  # python:3.x image has no compatible manifest. Linux already tests 3.13, so
  # Windows tests the newest supported version.
  image: "python:3.14-windowsservercore-ltsc2025"
  variables:
    PYTHON_VERSION: "3.14"
  before_script:
    - powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
    - $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
  script:
    - uv sync --python $env:PYTHON_VERSION --extra test --extra examples
    - uv run --python $env:PYTHON_VERSION pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  cache:
    key: uv-$CI_JOB_NAME-$PYTHON_VERSION
    paths:
      - .uv-cache

semantic_release:
  stage: release
  # Derive the release level from commits since the last tag: fix -> patch,
  # feat -> minor, and BREAKING CHANGE -> major. Other commit formats do not
  # trigger a release.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    # semantic-release needs the complete history to inspect commits since the
    # last tag.
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - git config --global user.name "Janitor"
    - git config --global user.email "squad@fz-juelich.de"
    - git remote set-url origin https://squad_janitor:$CI_FORMAT@$CI_SERVER_HOST/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    # Attach HEAD to the branch so semantic-release can match its branch
    # configuration and push the release commit.
    - git fetch origin $CI_COMMIT_BRANCH
    - git checkout $CI_COMMIT_BRANCH
    - git reset --hard origin/$CI_COMMIT_BRANCH
    - uv tool install python-semantic-release
  script:
    - |
      # `version --print-tag` returns the previous tag when no release is due.
      # Compare it with the last released tag to detect that case. Before the
      # first release, the last released tag is empty.
      RELEASE_TAG="$(semantic-release version --print-tag)"
      LAST_TAG="$(semantic-release version --print-last-released-tag)"
      if [ "$RELEASE_TAG" = "$LAST_TAG" ]; then
        echo "No release-worthy commits; no version will be published."
        echo "RELEASE_CREATED=false" > release.env
        exit 0
      fi
      echo "RELEASE_CREATED=true" > release.env
      echo "RELEASE_TAG=$RELEASE_TAG" >> release.env
      # Update the version and changelog, build the package, and push the commit
      # and tag. The next job creates the GitLab Release with CI_JOB_TOKEN.
      semantic-release version --push --changelog --no-vcs-release
  artifacts:
    paths:
      - dist/
      - CHANGELOG.md
      - release.env
    expire_in: never
    reports:
      dotenv: release.env

# Create a GitLab Release for each version above. glab's CI auto-login sends
# CI_JOB_TOKEN with the required JOB-TOKEN header; assigning it to GITLAB_TOKEN
# would send the wrong header and cause a 404 response.
gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: semantic_release
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - |
      if [ "$RELEASE_CREATED" != "true" ]; then
        echo "semantic-release did not cut a version; no GitLab Release needed."
        exit 0
      fi
      # Prevent these variables from overriding CI_JOB_TOKEN with a stale or
      # under-scoped personal token.
      unset GITLAB_TOKEN GITLAB_ACCESS_TOKEN OAUTH_TOKEN
      # This command updates an existing release, so interrupted jobs can retry
      # safely.
      glab release create "$RELEASE_TAG" \
        --name "Release $RELEASE_TAG" \
        --notes-file CHANGELOG.md \
        --ref "$RELEASE_TAG"

# Archive releases on Zenodo using the tagged CITATION.cff.
# Skip this job when ZENODO_SPANDAN is unset.
zenodo:
  stage: release
  needs:
    - job: semantic_release
      artifacts: true
    - job: gitlab_release
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $ZENODO_SPANDAN
  script:
    - |
      if [ "$RELEASE_CREATED" != "true" ]; then
        echo "semantic-release did not cut a version; nothing to archive."
        exit 0
      fi
      # Fetch the release tag created after this job checked out the source.
      git fetch --tags origin
      ARCHIVE="qimchi-connect-$RELEASE_TAG.zip"
      git archive --format=zip --prefix="qimchi-connect-${RELEASE_TAG#v}/" -o "$ARCHIVE" "$RELEASE_TAG"
      git show "$RELEASE_TAG:CITATION.cff" > release.cff
      git show "$RELEASE_TAG:README.md" > release-readme.md
      git show "$RELEASE_TAG:CHANGELOG.md" > release-changelog.md
      pip install --quiet pyyaml
      ZENODO_TOKEN="$ZENODO_SPANDAN" python scripts/zenodo_release.py --tag "$RELEASE_TAG" --cff release.cff --readme release-readme.md --changelog release-changelog.md --file "$ARCHIVE"

pypi:
  stage: release
  needs:
    - job: semantic_release
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $PYPI_SPANDAN
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
  script:
    - |
      if ! ls dist/*.whl >/dev/null 2>&1; then
        echo "semantic-release produced no distribution -- nothing to publish."
        exit 0
      fi
    - uv publish --token "$PYPI_SPANDAN"

# Build the package on the preview integration branch. On main,
# semantic_release builds it after updating the version.
build_package:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == "preview"
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
  script:
    - uv build
  artifacts:
    paths:
      - dist/*.tar.gz
      - dist/*.whl
