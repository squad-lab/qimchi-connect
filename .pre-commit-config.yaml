# After installing the dev extra, run `uv run pre-commit install` once.
#
# Ruff reads its settings from pyproject.toml, both here and on the command line.
#
# Keep `rev` aligned with the `dev` extra and CI lint job.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Ruff's I rules sort imports; the formatter does not.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
