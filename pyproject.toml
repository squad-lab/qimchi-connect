[project]
name = "qimchi-connect"
version = "0.1.0"
description = "Publish and discover live xarray datasets in Qimchi"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Spandan Anupam", email = "s.anupam@fz-juelich.de" },
  { name = "Jyotirmaya Shivottam", email = "jyotirmaya.shivottam@niser.ac.in" },
]
keywords = ["quantum", "measurement", "live", "xarray", "websockets", "qimchi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    # QCUtilsSnapshotProvider reads an in-memory Zarr store. qcutils also
    # depends on Zarr.
    "zarr>=2.18",
    # websockets 16 logs a full traceback when a timed-out probe disconnects
    # before sending a request. Version 17 closes the connection without one.
    "websockets>=17.1,<18",
    "xarray>=2024.1",
]

[project.urls]
Homepage = "https://gitlab.com/squad-lab/qimchi-connect"
Repository = "https://gitlab.com/squad-lab/qimchi-connect"
Issues = "https://gitlab.com/squad-lab/qimchi-connect/-/issues"
Qimchi = "https://gitlab.com/squad-lab/qimchi"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
# Install development dependencies with `uv sync --extra dev`. Run
# `uv run pre-commit install` once per clone.
dev = [
    "pre-commit>=4",
    # Use the same version here, in .pre-commit-config.yaml, and in the CI
    # `lint` job. Different versions can produce different formatting.
    "ruff==0.16.6",
    "pytest>=8",
    "pytest-cov>=5",
]
# Required by the QCoDeS example and tests. CI installs this extra so the tests
# use QCoDeS instead of skipping it.
examples = [
    "qcodes>=0.42",
]
# Required by QuantifySnapshotProvider. Its tests use a fake module and do not
# require this extra.
quantify = [
    "quantify-core>=0.7",
]

[project.scripts]
qimchi-connect = "qimchi_connect.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qimchi_connect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/qimchi_connect"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# The pre-commit formatter receives only Python files. Exclude Markdown so
# `ruff format .`, pre-commit, and CI check the same files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E and F are Ruff defaults. I enables import sorting.
select = ["E", "F", "I"]
# The formatter manages line length. Ignore E501 for content it cannot split,
# such as long strings and URLs in comments.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qimchi_connect"]
