[project]
name = "qimchi-connect"
version = "0.3.2"
description = "Publish and discover live xarray datasets in Qimchi"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Jyotirmaya Shivottam", email = "shivottam@proton.me" },
  { name = "Spandan Anupam", email = "s.anupam@fz-juelich.de" },
  { name = "Vincent Mourik", email = "v.mourik@fz-juelich.de" },
]
keywords = ["quantum", "measurement", "live", "xarray", "websockets", "qimchi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    # QanarySnapshotProvider reads Qanary's in-memory Zarr store.
    "zarr>=2.18",
    # websockets 17 avoids a traceback when a timed-out probe disconnects.
    "websockets>=17.1,<18",
    "xarray>=2024.1",
]

[project.urls]
Homepage = "https://gitlab.com/squad-lab/qimchi-connect"
Repository = "https://gitlab.com/squad-lab/qimchi-connect"
Issues = "https://gitlab.com/squad-lab/qimchi-connect/-/issues"
Qimchi = "https://qimchi.squad-lab.org/"
"SQUAD Lab" = "https://squad-lab.org/"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
# Install with `uv sync --extra dev`, then run `uv run pre-commit install`.
dev = [
    "pre-commit>=4",
    # Keep this version aligned with .pre-commit-config.yaml and CI.
    "ruff==0.16.6",
    "pytest>=8",
    "pytest-cov>=5",
]
# The QCoDeS example and provider tests use this extra.
examples = [
    "qcodes>=0.59.0",
]
# QuantifySnapshotProvider requires this extra; its tests use a fake module.
quantify = [
    "quantify-core>=0.7",
]

[project.scripts]
qimchi-connect = "qimchi_connect.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qimchi_connect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/qimchi_connect"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.semantic_release]
# CI sets the version from commit messages. Do not edit the version manually.
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): v{version}\n\n[skip ci]"
# Set a valid author for release commits; semantic-release does not inherit the
# Git identity configured by CI.
commit_author = "Janitor <squad@fz-juelich.de>"
# Update citation metadata and include it in the release commit.
build_command = "bash scripts/sync_release_metadata.sh && uv build"
assets = ["CITATION.cff", "README.md"]
tag_format = "v{version}"
# Keep releases below 1.0 while the API is unstable.
major_on_zero = false
allow_zero_version = true

# Only `main` creates releases. `preview` is tested and built but not tagged.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

# Build and test preview without publishing it.
[tool.semantic_release.branches.preview]
match = "preview"
prerelease = true
prerelease_token = "rc"

# Tell semantic-release to generate GitLab commit links.
[tool.semantic_release.remote]
type = "gitlab"
domain = "gitlab.com"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^ruff update$",
    # CI formatting commits do not require a release.
    "^style: apply ruff fixes",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# Match the files formatted by pre-commit and CI.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# I adds import sorting to Ruff's default E and F rules.
select = ["E", "F", "I"]
# Let the formatter manage line length; it cannot split every string or URL.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qimchi_connect"]

# Preserve LF line endings when Ruff runs on Windows.
[tool.ruff.format]
line-ending = "lf"
